<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gilberto Morelos | Redes Sociales</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 35px 18px;
      font-family: Arial, sans-serif;
      background: #f6f1e8;
      color: #292929;
      text-align: center;
    }
    .contenedor {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }
    .foto-perfil {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 67% 40%;
      display: block;
      margin: 0 auto 18px;
      border: 4px solid #ffffff;
    }
    .logo {
      display: block;
      width: 190px;
      max-width: 65%;
      height: auto;
      margin: 0 auto 15px;
    }
    h1 {
      margin: 5px 0 6px;
      font-size: 28px;
    }
    .subtitulo {
      color: #666666;
      margin: 0 auto 28px;
      line-height: 1.5;
    }
    h2 {
      margin-top: 32px;
      margin-bottom: 14px;
      font-size: 18px;
    }
    a.boton {
      display: block;
      margin: 12px 0;
      padding: 16px;
      border-radius: 12px;
      background: #741f35;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s ease;
    }
    a.boton:hover { opacity: 0.9; }
    .secundario { background: #9a7951 !important; }
    .pie {
      margin-top: 35px;
      padding-bottom: 15px;
      font-size: 14px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="contenedor">

    <img src="foto-gilberto-1.jpg" alt="Gilberto Morelos" class="foto-perfil">
    

    <h1>Gilberto Morelos</h1>

    <p class="subtitulo">
      Conoce más y sígueme en mis redes sociales
    </p>

    <a class="boton"
       href="https://www.facebook.com/share/1BqNrCeboM/"
       target="_blank" rel="noopener noreferrer">
       Facebook
    </a>

    <a class="boton"
       href="https://www.instagram.com/gil.morelos?igsh=aGRzMmE2cGlxcGN6"
       target="_blank" rel="noopener noreferrer">
       Instagram
    </a>

    <a class="boton"
       href="https://www.tiktok.com/@morelos.gilberto?_r=1&amp;_t=ZS-98rIcXP2ahu"
       target="_blank" rel="noopener noreferrer">
       TikTok
    </a>

    <a class="boton"
       href="https://youtube.com/@morelosgilberto?si=MvEjD6In1Z63kTn-"
       target="_blank" rel="noopener noreferrer">
       YouTube
    </a>

    <h2>Un Morelos para Morelia</h2>

    <a class="boton secundario"
       href="https://www.facebook.com/share/1Eyn4TkUxW/o"
       target="_blank" rel="noopener noreferrer">
       Facebook · Un Morelos para Morelia
    </a>

    <h2>Futura A.C.</h2>

    <a class="boton secundario"
       href="https://www.instagram.com/futuraac?igsh=MTY4MWgzd29rNmZ1bg=="
       target="_blank" rel="noopener noreferrer">
       Instagram · Futura A.C.
    </a>

    <a class="boton secundario"
       href="https://www.facebook.com/share/1cKzS6TFQX/"
       target="_blank" rel="noopener noreferrer">
       Facebook · Futura A.C.
    </a>

    <div class="pie">
      Gilberto Morelos · Morelia, Michoacán
    </div>

  </div>
</body>
</html>
