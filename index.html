<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gilberto Morelos | Redes Sociales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 35px 18px;
      font-family: Arial, sans-serif;
      background: #f6f1e8;
      color: #292929;
      text-align: center;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .iniciales {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #741f35;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 28px;
    }

    h2 {
      margin-top: 32px;
      font-size: 18px;
    }

    a.boton {
      display: block;
      margin: 12px 0;
      padding: 16px;
      border-radius: 12px;
      background: #741f35;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a.boton:hover {
      opacity: 0.9;
    }

    .secundario {
      background: #9a7951 !important;
    }

    .pie {
      margin-top: 35px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="iniciales">GM</div>

    <h1>Gilberto Morelos</h1>

    <p class="subtitulo">
      Conoce más y sígueme en mis redes sociales
    </p>

    <a class="boton"
       href="https://www.facebook.com/share/1BqNrCeboM/"
       target="_blank">
       Facebook
    </a>

    <a class="boton"
       href="https://www.instagram.com/gil.morelos?igsh=aGRzMmE2cGlxcGN6"
       target="_blank">
       Instagram
    </a>

    <a class="boton"
       href="https://www.tiktok.com/@morelos.gilberto?_r=1&_t=ZS-98rIcXP2ahu"
       target="_blank">
       TikTok
    </a>

    <a class="boton"
       href="https://youtube.com/@morelosgilberto?si=MvEjD6In1Z63kTn-"
       target="_blank">
       YouTube
    </a>

    <h2>Un Morelos para Morelia</h2>

    <a class="boton secundario"
       href="https://www.facebook.com/share/1Eyn4TkUxW/o"
       target="_blank">
       Facebook · Un Morelos para Morelia
    </a>

    <h2>Futura A.C.</h2>

    <a class="boton secundario"
       href="https://www.instagram.com/futuraac?igsh=MTY4MWgzd29rNmZ1bg=="
       target="_blank">
       Instagram · Futura A.C.
    </a>

    <a class="boton secundario"
       href="https://www.facebook.com/share/1cKzS6TFQX/"
       target="_blank">
       Facebook · Futura A.C.
    </a>

    <div class="pie">
      Gilberto Morelos · Morelia, Michoacán
    </div>

  </div>

</body>
</html>
